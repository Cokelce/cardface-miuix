name: Build OnePlus APK
description: Check OnePlus scope, test, build and verify the existing signing identity.
inputs:
  signing-keystore:
    description: Base64 of the existing Android Debug signing keystore
    required: true
  artifact-name:
    description: Actions artifact name
    default: oneplus-test-apk
outputs:
  version:
    description: APK versionName
    value: ${{ steps.metadata.outputs.version }}
  apk:
    description: Packaged APK path
    value: ${{ steps.package.outputs.apk }}
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - name: Check adaptation invariants and automation tests
      shell: bash
      run: |
        python3 tools/ci/check_oneplus.py
        python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
    - name: Install Android SDK
      shell: bash
      run: |
        sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools' || sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
        printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
    - name: Restore the existing APK signing identity
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.signing-keystore }}
      run: |
        test -n "$KEYSTORE_BASE64" || { echo 'Signing secret is missing'; exit 1; }
        install -d -m 700 "$HOME/.android"
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
        chmod 600 "$HOME/.android/debug.keystore"
    - name: Read version
      id: metadata
      shell: bash
      run: |
        python3 - <<'PY'
        import re, os
        from pathlib import Path
        text = Path('app/build.gradle.kts').read_text()
        version = re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1)
        code = re.search(r'versionCode\s*=\s*(\d+)', text).group(1)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'version={version}\ncode={code}\n')
        PY
    - name: Build and run unit tests
      shell: bash
      run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :imaging:test :app:assembleDebug
    - name: Verify and package APK
      id: package
      shell: bash
      env:
        VERSION: ${{ steps.metadata.outputs.version }}
      run: |
        APK='app/build/outputs/apk/debug/app-debug.apk'
        # Always re-sign the completed APK explicitly: AGP debug-keystore discovery can vary with Runner configuration.
        "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
          --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
          --ks-pass pass:android --key-pass pass:android \
          --out "$RUNNER_TEMP/cardface-signed.apk" "$APK"
        APK="$RUNNER_TEMP/cardface-signed.apk"
        "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/cardface-certificate.txt"
        cat "$RUNNER_TEMP/cardface-certificate.txt"
        grep -qi '62e7a1035526449f0c04f6e3045295bb92a114aaf9c125253d01e93a81e52062' "$RUNNER_TEMP/cardface-certificate.txt"
        mkdir -p .ci-output
        cp "$APK" ".ci-output/CardFace-${VERSION}.apk"
        (cd .ci-output && sha256sum "CardFace-${VERSION}.apk" > "CardFace-${VERSION}.apk.sha256")
        printf 'apk=.ci-output/CardFace-%s.apk\n' "$VERSION" >> "$GITHUB_OUTPUT"
        python3 - <<'PY'
        from pathlib import Path
        import xml.etree.ElementTree as ET
        totals = [0, 0, 0, 0]
        for folder in ['app/build/test-results/testDebugUnitTest', 'imaging/build/test-results/test']:
            for path in Path(folder).glob('TEST-*.xml'):
                root = ET.parse(path).getroot()
                totals = [v + int(root.get(k, 0)) for v, k in zip(totals, ['tests', 'failures', 'errors', 'skipped'])]
        assert totals[0] > 0 and totals[1:3] == [0, 0], totals
        Path('.ci-output/test-summary.txt').write_text(f'Tests={totals[0]}, failures={totals[1]}, errors={totals[2]}, skipped={totals[3]}\n')
        print(Path('.ci-output/test-summary.txt').read_text())
        PY
    - name: Upload APK and test evidence
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          .ci-output/*.apk
          .ci-output/*.sha256
          .ci-output/test-summary.txt
          app/build/test-results/testDebugUnitTest/TEST-*.xml
          imaging/build/test-results/test/TEST-*.xml
        retention-days: 14
    - name: Stop build workers
      if: always()
      shell: bash
      run: bash ./gradlew --stop || true
