name: OnePlus CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a checked official release after checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cardface-release-serialization
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-oneplus
        id: build
        with:
          signing-keystore: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          artifact-name: oneplus-${{ github.run_number }}-${{ github.run_attempt }}
      - name: Publish checked official release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          python3 tools/ci/publish_release.py --version "$VERSION" --target "$(git rev-parse HEAD)"
