name: Upstream OnePlus Sync
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
concurrency:
  group: upstream-oneplus-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Import upstream snapshot and apply owner-maintained OnePlus adaptation
        id: sync
        run: python3 tools/ci/snapshot_sync.py prepare
      - name: Compile and test adaptation
        if: steps.sync.outputs.changed == 'true'
        uses: ./ .github/actions/build-oneplus
        with:
          signing-keystore: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          artifact-name: upstream-${{ steps.sync.outputs.upstream_sha }}
      - name: Commit synced source directly to main
        if: steps.sync.outputs.changed == 'true'
        env:
          SYNC_VERSION: ${{ steps.sync.outputs.version }}
        run: |
          git add -A
          git commit -m "chore: sync upstream and adapt OnePlus as ${SYNC_VERSION}"
          git push origin HEAD:main
      - name: Publish signed prerelease directly
        if: steps.sync.outputs.changed == 'true'
        env:
          SYNC_VERSION: ${{ steps.sync.outputs.version }}
        run: |
          python3 tools/ci/publish_prerelease.py --version "$SYNC_VERSION" --target "$(git rev-parse HEAD)"
      - name: Report failure
        if: failure()
        run: |
          python3 tools/ci/sync_upstream.py report "自动同步、编译或发布失败：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}。详情见工作流日志。"
